name: imagen

# Construye la imagen aqui y la publica en GHCR, para que el servidor solo
# tenga que hacer `pull`. Construir en el servidor es fragil: depende de que
# tenga salida a internet, memoria y disco durante el build, y cuando falla el
# error sale enterrado en el log de Portainer.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Pruebas
        run: |
          python -m pip install --quiet -e ".[dev]"
          # Las unitarias del dominio, mas la que verifica que TODO archivo
          # compile y TODO modulo importe. Esa ultima existe porque un
          # reemplazo por regex dejo un archivo roto y llego a main.
          python -m pytest tests -q
          # el parser contra el archivo real de correos; si no esta, corre solo
          # las unitarias y no falla
          python pruebas/test_alertas.py
          # que toda variable que el codigo lee llegue al contenedor
          python pruebas/test_config.py

      - name: Lint
        run: |
          # Ya cubre TODO el codigo, no solo src/. La deuda que queda esta
          # declarada como per-file-ignores en pyproject.toml, a la vista, y
          # cualquier cosa fuera de esa lista falla el CI.
          #
          # Extenderlo aqui encontro de una un `fechas` sin importar en
          # asesor.py y presupuestos.py: /asesor se caia al llamarlo, y ningun
          # import ni prueba lo veia porque estaba dentro de una funcion.
          python -m ruff check src tests *.py parsers ingesta pruebas
          python -m ruff format --check src tests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr exige el nombre en minusculas y el usuario de GitHub puede tener
      # mayusculas, asi que se normaliza una vez y se reutiliza.
      - name: Nombre de la imagen
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_FECHA=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que la imagen arranca
        run: |
          docker run --rm -e FINANZAS_DATOS=/datos \
            ${{ steps.img.outputs.ref }}:latest \
            python -c "import sys; sys.path.insert(0,'/app/automatizacion'); import finanzas.dominio.conciliacion, finanzas.dominio.dinero, finanzas.dominio.fechas, finanzas.dominio.texto; from finanzas.adaptadores.almacen import Almacen; import config, db, firefly, clasificador, publicador, conciliador, bot, telegram, ia, interprete, asesor, presupuestos, taxonomia, demonio, servicio; print('paquete + modulos planos: todo importa')"
