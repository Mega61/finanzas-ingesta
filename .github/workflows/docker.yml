name: imagen

# Construye la imagen aqui y la publica en GHCR, para que el servidor solo
# tenga que hacer `pull`. Construir en el servidor es fragil: depende de que
# tenga salida a internet, memoria y disco durante el build, y cuando falla el
# error sale enterrado en el log de Portainer.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Pruebas
        run: |
          python -m pip install --quiet -r requirements.txt
          # Las pruebas del parser no necesitan el archivo de correos: cuando no
          # lo encuentran corren solo las unitarias y no fallan.
          python pruebas/test_alertas.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr exige el nombre en minusculas y el usuario de GitHub puede tener
      # mayusculas, asi que se normaliza una vez y se reutiliza.
      - name: Nombre de la imagen
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que la imagen arranca
        run: |
          docker run --rm -e FINANZAS_DATOS=/datos \
            ${{ steps.img.outputs.ref }}:latest \
            python -c "import sys; sys.path.insert(0,'/app/automatizacion'); import config, db, clasificador, publicador, conciliador, bot, telegram, demonio, servicio; print('todos los modulos importan')"
