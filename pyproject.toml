[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finanzas-ingesta"
version = "0.2.0"
description = "Ingesta de alertas bancarias a Firefly III, con conciliacion contra extractos y clasificacion por Telegram"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "msal==1.35.1",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
finanzas = "finanzas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finanzas"]
# esquema.sql viaja DENTRO del paquete: es la definicion de la base, no un
# archivo de configuracion que el usuario monte. Se lee con importlib.resources.
artifacts = ["src/finanzas/esquema.sql"]


# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -q para que el reporte quepa en pantalla; --strict-markers para que un marker
# mal escrito falle en vez de ignorarse en silencio.
addopts = "-q --strict-markers --strict-config"
markers = [
    "lento: toca red o disco de verdad, se salta con -m 'not lento'",
    "necesita_firefly: requiere una instancia de Firefly configurada",
    "necesita_correo: requiere el archivo local de .eml",
]
filterwarnings = ["error::DeprecationWarning"]


# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: variables sin usar, imports sin usar
    "I",         # isort: orden de imports
    "B",         # bugbear: trampas reales (mutables por defecto, except amplio)
    "UP",        # pyupgrade
    "SIM",       # simplificaciones
    "RUF",       # reglas propias de ruff
    "PLC", "PLE", "PLW",  # pylint: convenciones, errores, avisos
    "DTZ",       # datetimes sin zona horaria
    "PTH",       # usar pathlib en vez de os.path
    "T20",       # print olvidado en codigo de libreria
    "ARG",       # argumentos sin usar
    "TRY",       # manejo de errores: except amplio, raise sin from
]
ignore = [
    "E501",      # el largo de linea lo maneja el formateador
    "TRY003",    # mensajes largos en las excepciones: aqui se quieren largos
]

[tool.ruff.lint.per-file-ignores]
# La capa de entrada son los CLI: imprimen porque esa es su interfaz.
"src/finanzas/cli.py" = ["T20"]
# registro.py es EL modulo cuyo trabajo es escribir a stdout: es el unico
# sitio del paquete donde print() es lo correcto, y por eso existe.
"src/finanzas/registro.py" = ["T20"]
# Las herramientas de un solo uso: CLI de diagnostico que corren fuera del
# contenedor.
"herramientas/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
# El simulador del chat son DOBLES de Telegram y Firefly: sus firmas
# tienen que coincidir con las de verdad aunque no usen todo lo que
# reciben. Pedirle que use cada argumento seria pedirle que no sea un
# doble.
"herramientas/simular_chat.py" = ["T20", "PLC0415", "PTH", "ARG"]
# Las pruebas de fechas construyen datetime naive A PROPOSITO, para
# verificar que a_instante los convierta a aware.
"tests/*" = ["T20", "ARG"]
"tests/unidad/test_fechas.py" = ["T20", "ARG", "DTZ001"]

# Deuda conocida del codigo que se acaba de mover a src/, declarada aqui a la
# vista y no escondida en un `# noqa` por linea:
#
#   PLC0415 imports diferidos a proposito (msal, pdfplumber: pesados y de un
#           solo camino) y los de los bloques __main__
#   PTH     os.path -> pathlib: ~80 cambios mecanicos, sin efecto en el
#           comportamiento
#   ARG001  parametros que se conservan para no romper firmas de llamadas
#
# Todo lo demas SI falla el CI, en todo el arbol.
"src/finanzas/adaptadores/*.py" = ["PLC0415", "PTH", "ARG001"]
"src/finanzas/aplicacion/*.py" = ["PLC0415", "PTH", "ARG001"]
"src/finanzas/entrada/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
"src/finanzas/parsers/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["finanzas"]

[tool.ruff.format]
quote-style = "single"


# ---------------------------------------------------------------- cobertura
[tool.coverage.run]
source = ["finanzas"]
branch = true

[tool.coverage.report]
# El dominio es logica pura: ahi la cobertura tiene que ser alta porque no hay
# excusa. Los adaptadores tocan red y se cubren con pruebas de integracion.
exclude_lines = [
    "pragma: sin cobertura",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    # Los Protocol son contratos: los cuerpos son `...`, no hay nada que cubrir.
    '^\s*\.\.\.$',
]

# DOS puertas, y las dos dicen la verdad.
#
# Esta es la del TOTAL, y es un trinquete: solo puede subir. Va en 32.1% en
# local y 30.8% en el CI — alla se salta la prueba de los 863 correos, que no
# estan en el repo. El piso se calibra contra el CI, que es quien lo hace
# cumplir, con un punto de holgura.
#
# Ese numero no es una caida: antes decia 93% porque solo medía `dominio/` y
# `almacen.py` — el resto del codigo estaba fuera de src/ y no se contaba. Al
# entrar todo al paquete, es lo que siempre fue verdad. El nucleo sigue donde
# estaba (dominio 87-95%, almacen 93%) y eso lo cuida la segunda puerta, que el
# CI corre aparte con --cov-fail-under=90 sobre finanzas.dominio y
# finanzas.adaptadores.almacen.
#
# De los ocho bugs que llegaron a produccion, siete estaban en modulos sin una
# sola prueba. Los que siguen sin cubrir son justo `aplicacion/` y `entrada/`.
fail_under = 29
show_missing = true
skip_covered = true
