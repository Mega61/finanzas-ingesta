[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finanzas-ingesta"
version = "0.2.0"
description = "Ingesta de alertas bancarias a Firefly III, con conciliacion contra extractos y clasificacion por Telegram"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "msal==1.35.1",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
finanzas = "finanzas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finanzas"]


# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -q para que el reporte quepa en pantalla; --strict-markers para que un marker
# mal escrito falle en vez de ignorarse en silencio.
addopts = "-q --strict-markers --strict-config"
markers = [
    "lento: toca red o disco de verdad, se salta con -m 'not lento'",
    "necesita_firefly: requiere una instancia de Firefly configurada",
    "necesita_correo: requiere el archivo local de .eml",
]
filterwarnings = ["error::DeprecationWarning"]


# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: variables sin usar, imports sin usar
    "I",         # isort: orden de imports
    "B",         # bugbear: trampas reales (mutables por defecto, except amplio)
    "UP",        # pyupgrade
    "SIM",       # simplificaciones
    "RUF",       # reglas propias de ruff
    "PLC", "PLE", "PLW",  # pylint: convenciones, errores, avisos
    "DTZ",       # datetimes sin zona horaria
    "PTH",       # usar pathlib en vez de os.path
    "T20",       # print olvidado en codigo de libreria
    "ARG",       # argumentos sin usar
    "TRY",       # manejo de errores: except amplio, raise sin from
]
ignore = [
    "E501",      # el largo de linea lo maneja el formateador
    "TRY003",    # mensajes largos en las excepciones: aqui se quieren largos
]

[tool.ruff.lint.per-file-ignores]
# los CLI y las herramientas si imprimen, es su trabajo
"src/finanzas/cli.py" = ["T20"]
# Las herramientas de un solo uso: son CLI de diagnostico, imprimen, y
# hacen os.path porque corren fuera del contenedor.
"herramientas/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
# Las pruebas de fechas construyen datetime naive A PROPOSITO, para
# verificar que a_instante los convierta a aware.
"tests/*" = ["T20", "ARG"]
"tests/unidad/test_fechas.py" = ["T20", "ARG", "DTZ001"]

# Los modulos planos de la raiz todavia no se han movido a src/. Se revisan con
# las mismas reglas menos estas cuatro, que son deuda conocida y mecanica:
#
#   T20     son CLI: imprimen porque es su interfaz
#   PLC0415 quedan tres imports diferidos a proposito (msal, pdfplumber) y los
#           de los bloques __main__
#   PTH     os.path -> pathlib: ~90 cambios mecanicos, sin efecto en el
#           comportamiento. Se hacen al mover cada modulo a src/
#   ARG001  parametros que se conservan para no romper firmas de llamadas
#
# La lista esta aqui, y no en un `# noqa` por linea, para que se vea cuanto
# falta. Todo lo demas SI falla el CI.
"*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
"parsers/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
"ingesta/*.py" = ["T20", "PLC0415", "PTH", "ARG001"]
"pruebas/*.py" = ["T20", "PLC0415", "PTH", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["finanzas"]

[tool.ruff.format]
quote-style = "single"


# ---------------------------------------------------------------- cobertura
[tool.coverage.run]
source = ["src/finanzas"]
branch = true

[tool.coverage.report]
# El dominio es logica pura: ahi la cobertura tiene que ser alta porque no hay
# excusa. Los adaptadores tocan red y se cubren con pruebas de integracion.
exclude_lines = [
    "pragma: sin cobertura",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    # Los Protocol son contratos: los cuerpos son `...`, no hay nada que cubrir.
    '^\s*\.\.\.$',
]

# El umbral esta en 90 y hoy va en 93. No es un numero decorativo: de los ocho
# bugs que llegaron a produccion, siete estaban en modulos sin una sola prueba.
# Si baja de 90, el CI falla; subirlo es bienvenido, aflojarlo se discute.
fail_under = 90
show_missing = true
skip_covered = true
